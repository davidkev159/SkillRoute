services:
  - type: web
    name: skillroute-api
    runtime: python
    pythonVersion: 3.12.10
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEO4J_URI
        sync: false # set to your bolt+s://<instance-id>.databases.cognodb.cloud URI
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: CORS_ORIGINS
        sync: false # set to your deployed frontend origin, e.g. https://skillroute.vercel.app
      - key: DEBUG_LOG_QUERIES
        value: "false"
